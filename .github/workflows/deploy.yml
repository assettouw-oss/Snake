name: Deploy Snake
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pygbag
        run: pip install pygbag
      - name: Build game
        run: |
          ls -la
          ls -la Snake || true
          if [ -f main.py ]; then python -m pygbag --build main.py; else python -m pygbag --build Snake/main.py; fi
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:./build/web
